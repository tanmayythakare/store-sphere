services:
  postgres:
    image: postgres:16-alpine
    container_name: store-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net
    # NOTE: Port 5432 is strictly internal to Docker's private bridge network.
    # It is completely blocked from the public internet for database isolation.

  app:
    image: ghcr.io/tanmayythakare/store-sphere:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-portal-app
    restart: unless-stopped
    ports:
      - "80:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/storedb?schema=public
      JWT_SECRET: production-jwt-secret-key-storesphere-2026
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:

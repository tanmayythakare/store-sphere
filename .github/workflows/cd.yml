name: Continuous Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: store-sphere
  CLOUDFRONT_DISTRIBUTION_ID: E2R2S6I8KMY0VT
  EC2_INSTANCE_ID: i-0be82bd61bba54d22
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: client/package.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd client
          npm install
          npm run build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync Static Assets to AWS S3
        run: |
          aws s3 sync client/dist s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Backend (GHCR + EC2 via AWS SSM)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy Container to EC2 via AWS Systems Manager (SSM)
        run: |
          echo "Preparing SSM deployment payload..."
          cat << EOF > /tmp/ssm_deploy.json
          {
            "commands": [
              "git config --global --add safe.directory /home/ubuntu/store-sphere",
              "cd /home/ubuntu/store-sphere",
              "git pull origin main",
              "docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}",
              "docker compose pull app",
              "docker compose up -d --no-deps app",
              "docker exec store-portal-app npx prisma migrate deploy"
            ]
          }
          EOF

          echo "Dispatching deployment command to EC2 instance ${{ env.EC2_INSTANCE_ID }} via AWS SSM..."
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated Deploy via GHCR (${{ github.sha }})" \
            --parameters file:///tmp/ssm_deploy.json \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM Command ID: $CMD_ID"
          echo "Waiting for command execution to complete on EC2..."
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          echo "=== EC2 Execution Output ==="
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Verify Live System API Health
        run: |
          echo "Verifying live endpoint health..."
          for i in {1..6}; do
            if curl -fsSL https://d115c1ev3w1apg.cloudfront.net/api/health; then
              echo -e "\nSystem is healthy and live!"
              exit 0
            fi
            echo "Waiting for container startup... ($i/6)"
            sleep 5
          done
          echo "Health check timed out."
          exit 1

name: Continuous Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storedb?schema=public
        run: |
          cd server
          npx prisma migrate deploy

      - name: Execute Automated Supertest Integration Tests
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storedb?schema=public
          JWT_SECRET: ci-testing-jwt-secret-key-storesphere-2026
        run: |
          cd server
          npm test

      - name: Install Frontend Dependencies & Verify Build
        run: |
          cd client
          npm install
          npm run build

